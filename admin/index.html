<!doctype html>
<html lang="ms">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Dashboard Pemilik · Annur Time Table</title>
<link rel="icon" href="/brand/annurpro-icon-64.png">
<style>
:root{--ink:#0f172a;--mut:#64748b;--line:#e6ebf3;--bg:#eef2f8;--card:#fff;--navy:#0b2a6f;--navy2:#071b4d;--blue:#1d4ed8;--blue2:#0b3cc1;--red:#e11d2a;--amber:#a15c07;--ok:#047857;--warn:#a15c07;--bad:#d61f1f}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 Inter,"Segoe UI",system-ui,Roboto,Arial,sans-serif}
a{color:var(--blue)}
button,input,select{font:inherit}
/* ---------- log masuk (gelap, jalur cahaya, kad kaca) ---------- */
.lg{position:fixed;inset:0;background:#030509;color:#fff;overflow:hidden;display:flex;align-items:center}
.lg svg.st{position:absolute;inset:0;width:100%;height:100%}
.lg .st line{stroke-linecap:round}
.lg .st .run{stroke-dasharray:70 1400;animation:run linear infinite}
@keyframes run{from{stroke-dashoffset:1470}to{stroke-dashoffset:0}}
.lg .vig{position:absolute;inset:0;background:radial-gradient(70% 60% at 50% 40%,transparent 40%,rgba(0,0,0,.75))}
.lg .in{position:relative;z-index:1;width:100%;max-width:1440px;margin:0 auto;padding:0 6vw;display:grid;grid-template-columns:1.1fr minmax(340px,480px);gap:40px;align-items:center}
.lg .bar{width:64px;height:3px;background:var(--red);margin-bottom:34px}
.lg h1{font-size:clamp(44px,6.4vw,92px);line-height:.98;font-weight:500;letter-spacing:-.045em;margin:0}
.lg .sub{margin-top:28px;max-width:420px;color:#c9d2e3;font-size:17px;line-height:1.6}
.glass{background:linear-gradient(160deg,rgba(255,255,255,.14),rgba(255,255,255,.05));border:1px solid rgba(255,255,255,.2);border-radius:30px;padding:34px 36px 26px;backdrop-filter:blur(18px) saturate(140%);-webkit-backdrop-filter:blur(18px) saturate(140%);box-shadow:0 30px 80px rgba(0,0,0,.55)}
.brand{display:flex;align-items:center;gap:14px}
.brand .mark,.brand .lg-mark{width:48px;height:48px;flex:none;display:grid;place-items:center}
.brand .mark img,.brand .lg-mark img{width:48px;height:48px;object-fit:contain;filter:drop-shadow(0 4px 10px rgba(0,0,0,.18))}
.brand .lg-mark img{filter:drop-shadow(0 6px 18px rgba(64,200,210,.35))}
.brand i{width:42px;height:42px;border-radius:50%;background:var(--red);display:grid;place-items:center;font-style:normal;font-weight:800;color:#fff;font-size:20px;flex:none;box-shadow:0 6px 18px rgba(225,29,42,.45)}
.brand b{display:block;font-size:17px;font-weight:600}
.brand small{display:block;font-size:12px;letter-spacing:.12em;text-transform:uppercase;opacity:.65}
.glass h2{margin:28px 0 4px;font-size:26px;font-weight:600;letter-spacing:-.02em}
.glass p{margin:0 0 22px;color:#c9d2e3}
.glass label{display:block;font-size:14px;font-weight:600;margin:16px 0 8px}
.glass input{width:100%;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.22);border-radius:14px;color:#fff;padding:14px 16px;outline:none}
.glass input:focus{border-color:#7aa2ff;box-shadow:0 0 0 3px rgba(59,130,246,.25)}
.gbtn{width:100%;border:0;border-radius:16px;padding:16px;font-weight:700;font-size:16px;color:#fff;cursor:pointer;background:linear-gradient(180deg,#1f5cf0,#0b3cc1);box-shadow:0 10px 28px rgba(29,78,216,.45);display:flex;gap:10px;align-items:center;justify-content:center;margin-top:6px}
.gbtn:hover{filter:brightness(1.08)}
.obtn{width:100%;border:1px solid rgba(255,255,255,.25);background:rgba(255,255,255,.05);color:#fff;border-radius:16px;padding:14px;font-weight:600;cursor:pointer;margin-top:12px}
.obtn:hover{background:rgba(255,255,255,.1)}
.glass .ft{display:flex;justify-content:space-between;border-top:1px solid rgba(255,255,255,.15);margin-top:24px;padding-top:14px;font-size:13px;color:#aab6cc}
.glass .err{color:#ff8a8a;font-weight:600;margin-top:14px}
.glass details summary{cursor:pointer;color:#8fb0ff;font-size:14px;margin-top:16px}
@media(max-width:900px){.lg{position:relative;min-height:100%;align-items:flex-start;padding:60px 0}.lg .in{grid-template-columns:1fr}.lg h1{font-size:44px}}
@media(prefers-reduced-motion:reduce){.lg .st .run{animation:none;opacity:0}}
/* ---------- dashboard (tema terang, kad bulat, bar atas) ---------- */
.shell{max-width:1500px;margin:0 auto;padding:16px 18px 40px}
.topbar{background:#fff;border-radius:26px;box-shadow:0 10px 30px rgba(15,23,42,.06);display:flex;align-items:center;gap:16px;padding:12px 18px;margin-bottom:18px;flex-wrap:wrap}
.topbar .brand b{font-size:19px;color:var(--ink);white-space:nowrap}
@media(min-width:1101px){.topbar{flex-wrap:nowrap}.topbar .nav{flex-wrap:nowrap}}
@media(max-width:1250px){.topbar .brand b{display:none}.nav button span{display:none}}
.topbar .brand .mark,.brand .lg-mark{width:48px;height:48px;flex:none;display:grid;place-items:center}
.brand .mark img,.brand .lg-mark img{width:48px;height:48px;object-fit:contain;filter:drop-shadow(0 4px 10px rgba(0,0,0,.18))}
.brand .lg-mark img{filter:drop-shadow(0 6px 18px rgba(64,200,210,.35))}
.brand i{width:44px;height:44px}
.nav{margin:0 auto;display:flex;gap:4px;background:#eef2f8;border-radius:999px;padding:5px;flex-wrap:wrap}
.nav button{border:0;background:transparent;border-radius:999px;padding:9px 14px;white-space:nowrap;font-weight:600;color:#334155;cursor:pointer;display:flex;gap:8px;align-items:center}
.nav button.on{background:#0f172a;color:#fff}
.role{display:flex;align-items:center;gap:10px;background:#eef2f8;border-radius:999px;padding:6px 16px 6px 12px}
.role small{display:block;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--blue)}
.role b{font-weight:600}
.av{width:44px;height:44px;border-radius:50%;background:var(--blue);color:#fff;display:grid;place-items:center;font-weight:700}
.ib{width:44px;height:44px;border-radius:50%;background:#eef2f8;border:0;display:grid;place-items:center;cursor:pointer;color:#0f172a}
.grid{display:grid;grid-template-columns:minmax(300px,1fr) 2.2fr;gap:18px}
.right{display:grid;grid-template-rows:auto 1fr;gap:18px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.card{background:var(--card);border-radius:26px;box-shadow:0 10px 30px rgba(15,23,42,.05);padding:22px 22px}
.ch{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}
.ch h3{margin:0;font-size:21px;font-weight:600;letter-spacing:-.01em}
.chip{border:0;background:#eef2f8;border-radius:999px;padding:7px 16px;font-weight:600;color:#334155;cursor:pointer}
.ring{display:grid;place-items:center;margin:14px 0 6px;position:relative}
.ring .n{position:absolute;top:44px;font-size:30px;color:var(--blue2);font-weight:600}
.ring .tag{margin-top:-18px;background:var(--red);color:#fff;font-weight:600;border-radius:999px;padding:6px 16px;position:relative}
.hello{text-align:center;font-size:19px;font-weight:500;margin-top:8px}
.big{display:flex;align-items:baseline;gap:10px;margin:22px 0 14px}
.big b{font-size:44px;font-weight:500;letter-spacing:-.03em}
.big span{color:var(--blue2);font-size:15px}
.bars3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.bars3 i{display:block;height:8px;border-radius:99px;margin-bottom:12px}
.bars3 b{display:block;font-size:20px;font-weight:600}
.bars3 span{font-size:13px;color:var(--mut)}
.mini{display:grid;grid-template-columns:repeat(3,1fr);margin-top:22px;border-radius:20px;box-shadow:0 8px 24px rgba(15,23,42,.07);padding:16px 6px}
.mini div{text-align:center;border-right:1px solid var(--line)}
.mini div:last-child{border:0}
.mini em{width:32px;height:32px;border-radius:50%;display:inline-grid;place-items:center;font-style:normal;font-size:15px}
.mini b{display:block;font-size:24px;font-weight:500;margin-top:6px}
.mini span{font-size:12.5px;color:var(--mut)}
.hero{background:linear-gradient(135deg,var(--navy),var(--navy2));color:#fff;border-radius:26px;padding:22px}
.hero h3{margin:0;font-size:22px;font-weight:600}
.hero small{opacity:.8}
.hero .ch .chip{background:rgba(255,255,255,.14);color:#fff;border:1px solid rgba(255,255,255,.25)}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:14px}
.tile{background:#fff;color:var(--ink);border-radius:20px;padding:18px 20px}
.tile b{display:block;font-size:34px;font-weight:500;letter-spacing:-.02em}
.tile span{color:#334155}
.c-blue{color:var(--blue2)}.c-amber{color:var(--amber)}.c-red{color:var(--bad)}.c-ok{color:var(--ok)}
.vbars{display:flex;gap:18px;align-items:flex-end;height:330px;padding-top:12px}
.vb{flex:1 1 0;min-width:0;display:flex;flex-direction:column;align-items:center;height:100%}
.vb .track{flex:1;width:100%;background:#eef3fb;border-radius:22px;position:relative;display:flex;align-items:flex-end}
.vb .fill{width:100%;background:#c9d6ea;border-radius:22px;position:relative;min-height:22px;transition:height .8s cubic-bezier(.2,.7,.2,1)}
.vb.top .fill{background:var(--blue2)}
.vb .lab{position:absolute;top:-12px;left:50%;transform:translateX(-50%);background:#fff;color:var(--blue2);font-size:13px;font-weight:700;border-radius:999px;padding:2px 9px;box-shadow:0 2px 8px rgba(15,23,42,.08)}
.vb.top .lab{background:#0f172a;color:#fff}
.vb span{margin-top:12px;font-weight:500;text-align:center}
.acts{display:grid;gap:10px}
.act{border:1px solid var(--line);border-radius:18px;padding:12px 14px 12px 18px;display:flex;align-items:center;gap:12px;position:relative}
.act::before{content:"";position:absolute;left:8px;top:12px;bottom:12px;width:3px;border-radius:3px;background:var(--amber)}
.act.red::before{background:var(--bad)}
.act div{flex:1;min-width:0}
.act b{display:block;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.act small{color:var(--mut)}
.act small em{font-style:normal;font-weight:600;color:var(--amber)}
.act.red small em{color:var(--bad)}
.pbtn{border:0;background:var(--blue2);color:#fff;border-radius:999px;padding:8px 16px;font-weight:600;cursor:pointer;white-space:nowrap}
.btn{border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:999px;padding:8px 16px;cursor:pointer;font-weight:600}
.btn:hover{border-color:#b9c4d8}
.btn.p{background:var(--blue2);border-color:var(--blue2);color:#fff}
.btn.d{color:var(--bad)}
.btn.sm{padding:4px 12px;font-size:13px}
.bar2{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.bar2 input,.bar2 select{border:1px solid var(--line);border-radius:999px;padding:9px 16px;background:#f7f9fc}
.bar2 input{min-width:220px;flex:1}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:11px 12px;border-bottom:1px solid var(--line);vertical-align:middle;white-space:nowrap}
th{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--mut);font-weight:600}
td.w{white-space:normal;min-width:160px}
tr:hover td{background:#f8faff}
.pill{display:inline-block;border-radius:999px;padding:3px 11px;font-size:12px;font-weight:700}
.s-ok{background:#d1fae5;color:var(--ok)}.s-trial{background:#dbeafe;color:#1e40af}.s-grace{background:#fef3c7;color:var(--warn)}.s-bad{background:#fee2e2;color:var(--bad)}.s-mut{background:#eef1f5;color:var(--mut)}
.tag{font-size:11px;background:#eef1f5;color:var(--mut);border-radius:6px;padding:1px 6px;margin-left:6px}
.empty{color:var(--mut);padding:20px;text-align:center}
.note{font-size:13px;color:var(--mut);margin-top:12px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:18px}
h4{margin:0 0 10px;font-size:17px;font-weight:600}
.ov{position:fixed;inset:0;background:rgba(15,23,42,.45);display:flex;align-items:center;justify-content:center;padding:16px;z-index:10}
.dlg{background:#fff;border-radius:24px;max-width:520px;width:100%;padding:24px;max-height:92vh;overflow:auto}
.dlg h3{margin:0 0 4px}
.dlg label{display:block;font-size:13px;color:var(--mut);margin-top:12px}
.dlg input,.dlg select{width:100%;border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-top:4px;color:var(--ink)}
.dlg .row{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.dlg .row.end{justify-content:flex-end}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:999px;font-weight:600;z-index:20}
.loading{display:grid;place-items:center;height:60vh;color:var(--mut)}
/* ---------- artikel ---------- */
.ar-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:22px;align-items:start}
.ar-form label{display:block;font-size:13px;font-weight:600;color:#334155;margin:0 0 12px}
.ar-form label small{font-weight:500;color:var(--mut)}
.ar-form input,.ar-form select,.ar-form textarea{display:block;width:100%;border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-top:5px;color:var(--ink);background:#fbfcfe;font:inherit;font-weight:400}
.ar-form textarea{resize:vertical}
.ar-form input:focus,.ar-form textarea:focus,.ar-form select:focus{outline:none;border-color:#7aa2ff;box-shadow:0 0 0 3px rgba(59,130,246,.15)}
.ar-row{display:flex;gap:12px;align-items:flex-end}.ar-row label{flex:1}.ar-thumb{width:96px;height:60px;object-fit:cover;border-radius:10px;margin-bottom:12px;border:1px solid var(--line)}
.ar-row3{display:grid;grid-template-columns:1.4fr 1fr 1fr;gap:10px}
.ar-tools{display:flex;gap:4px;flex-wrap:wrap;background:#eef2f8;border-radius:12px 12px 0 0;padding:6px;border:1px solid var(--line);border-bottom:0}
.ar-tools button{border:0;background:#fff;border-radius:8px;padding:6px 10px;font-weight:600;font-size:13px;cursor:pointer;color:#334155}
.ar-tools button:hover{background:#dbe6ff}
.ar-form .ar-body{margin-top:0;border-radius:0 0 12px 12px;min-height:520px;font:15px/1.65 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.ar-prev{position:sticky;top:12px;max-height:calc(100vh - 24px);overflow:auto;border:1px solid var(--line);border-radius:18px;padding:18px 22px;background:#fff}
.ar-serp{border:1px dashed #cbd5e1;border-radius:12px;padding:12px 14px;margin-bottom:18px;font-family:Arial,sans-serif}
.ar-serp small{display:block;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--mut);margin-bottom:6px}
.ar-serp .u{display:block;font-size:13px;color:#202124}.ar-serp b{display:block;color:#1a0dab;font-size:19px;font-weight:400;margin:2px 0}.ar-serp p{margin:0;font-size:14px;color:#4d5156;line-height:1.5}
.ar-art{font-size:16.5px;line-height:1.75}.ar-art h1{font-size:30px;line-height:1.2;margin:0 0 6px;letter-spacing:-.02em}.ar-art .m{color:var(--mut);font-size:14px;margin-bottom:14px}
.ar-art .cv{width:100%;border-radius:14px;margin-bottom:14px}.ar-art h2{font-size:23px;margin:28px 0 8px}.ar-art h3{font-size:19px;margin:22px 0 6px}
.ar-art p{margin:0 0 14px}.ar-art img{max-width:100%;border-radius:12px}.ar-art blockquote{margin:16px 0;padding:10px 16px;border-left:4px solid #f59e0b;background:#fffbeb;border-radius:0 12px 12px 0}.ar-art blockquote p{margin:0}
.ar-art code{background:#eef2f8;border-radius:5px;padding:1px 5px}.ar-art pre{background:#0b1220;color:#e2e8f0;padding:12px;border-radius:12px;overflow:auto}
.ar-panes{display:none;gap:4px;background:#eef2f8;border-radius:999px;padding:4px;margin-bottom:12px;width:max-content}
.ar-panes button{border:0;background:transparent;border-radius:999px;padding:7px 16px;font-weight:600;cursor:pointer}.ar-panes button.on{background:#0f172a;color:#fff}
@media(max-width:1000px){.ar-grid{grid-template-columns:minmax(0,1fr)}.ar-panes{display:flex}.ar-tulis .ar-prev{display:none}.ar-lihat .ar-form{display:none}.ar-prev{position:static;max-height:none}.ar-row3{grid-template-columns:1fr 1fr}.ar-form .ar-body{min-height:380px}}
@media(max-width:1100px){.grid,.two{grid-template-columns:minmax(0,1fr)}.right,.card,.hero{min-width:0}}
@media(max-width:520px){.shell{padding:10px}.card,.hero{padding:18px 14px;border-radius:22px}.big b{font-size:36px}.bars3 span,.mini span{font-size:11.5px}.mini b{font-size:20px}.tile b{font-size:28px}.act{flex-wrap:wrap}}
@media(max-width:700px){.tiles{grid-template-columns:1fr}.grid2{grid-template-columns:1fr}.nav{order:3;width:100%;justify-content:center}.role{display:none}.vbars{height:240px;gap:10px}}
</style>

<div id="app"><div class="loading">Memuatkan…</div></div>
<script src="/config.js"></script>
<script src="/admin/artikel.js"></script>
<script>
(function () {
  'use strict';
  var CFG = window.APP_CONFIG || {}, API = String(CFG.licenseUrl || '').replace(/\/$/, '');
  var S = { token: '', data: null, tab: 'utama', q: '', f: 'semua', busy: false, who: '' };
  var $ = function (id) { return document.getElementById(id); };
  var esc = function (s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); };
  var rm = function (n) { return 'RM' + (Number(n) || 0).toLocaleString('ms-MY', { minimumFractionDigits: 0, maximumFractionDigits: 2 }); };
  var dmy = function (iso) { return iso ? iso.slice(8, 10) + '/' + iso.slice(5, 7) + '/' + iso.slice(0, 4) : '-'; };
  var PLAN = { percubaan: 'Percubaan', bulanan: 'Bulanan', tahunan: 'Tahunan', pilot: 'Perintis' };
  function toast(t) { var d = document.createElement('div'); d.className = 'toast'; d.textContent = t; document.body.appendChild(d); setTimeout(function () { d.remove(); }, 2600); }
  try { S.token = sessionStorage.getItem('adm-tok') || ''; } catch (e) { /* tiada storan */ }

  function api(path, opt) {
    opt = opt || {};
    return fetch(API + path, { method: opt.method || 'GET', headers: Object.assign({ authorization: 'Bearer ' + S.token }, opt.body ? { 'content-type': 'application/json' } : {}), body: opt.body ? JSON.stringify(opt.body) : undefined })
      .then(function (r) { return r.json().catch(function () { return {}; }).then(function (j) { if (!r.ok) { var e = new Error(j.error || ('HTTP ' + r.status)); e.status = r.status; throw e; } return j; }); });
  }
  function load() {
    $('app').innerHTML = '<div class="loading">Memuatkan data…</div>';
    return api('/admin/overview').then(function (d) { S.data = d; S.who = d.by === 'token' ? 'Token admin' : d.by; render(); })
      .catch(function (e) { if (e.status === 401) { S.token = ''; try { sessionStorage.removeItem('adm-tok'); } catch (x) { /* */ } loginView(e.message === 'tidak dibenarkan' ? 'Akaun ini tidak dibenarkan, atau sesi sudah tamat. Log masuk semula.' : e.message); } else loginView('Tidak dapat memuatkan data: ' + e.message); });
  }
  function setToken(t) { S.token = t; try { sessionStorage.setItem('adm-tok', t); } catch (e) { /* */ } load(); }

  // ---------- log masuk: latar gelap dengan jalur cahaya, kad kaca ----------
  function streaks() {
    var W = 1600, H = 900, vx = 800, vy = 520, out = [], rnd = (function (x) { return function () { x = (x * 9301 + 49297) % 233280; return x / 233280; }; })(7);
    var col = function () { var r = rnd(); return r < .55 ? '#cfd9ff' : r < .8 ? '#5b8cff' : '#ff9a3c'; };
    for (var k = 0; k < 46; k++) { var x = 520 + rnd() * 560, c = col(), w = (.6 + rnd() * 1.6).toFixed(2), o = (.15 + rnd() * .5).toFixed(2);
      out.push('<line x1="' + x.toFixed(0) + '" y1="0" x2="' + x.toFixed(0) + '" y2="' + vy + '" stroke="' + c + '" stroke-width="' + w + '" opacity="' + o + '"/>');
      if (rnd() < .45) out.push('<line class="run" x1="' + x.toFixed(0) + '" y1="0" x2="' + x.toFixed(0) + '" y2="' + vy + '" stroke="' + c + '" stroke-width="' + (+w + 1) + '" style="animation-duration:' + (3 + rnd() * 5).toFixed(1) + 's;animation-delay:-' + (rnd() * 6).toFixed(1) + 's"/>'); }

  // ---------- borang ----------
  function dialog(html, onReady) { var o = document.createElement('div'); o.className = 'ov'; o.innerHTML = '<div class="dlg">' + html + '</div>'; o.addEventListener('click', function (e) { if (e.target === o || e.target.dataset.close != null) o.remove(); }); document.body.appendChild(o); if (onReady) onReady(o); return o; }
  function planSel(v) { return '<select name="plan">' + Object.keys(PLAN).map(function (k) { return '<option value="' + k + '"' + (v === k ? ' selected' : '') + '>' + PLAN[k] + '</option>'; }).join('') + '</select>'; }
  function run(p, ok) { return p.then(function () { toast(ok); return load(); }).catch(function (e) { alert('Gagal: ' + e.message); }); }
  function editDlg(key) {
    var l = S.data.licences.find(function (x) { return x.key === key; }); if (!l) return;
    var who = l.kind === 'domain' ? { domain: l.id } : { email: l.id };
    dialog('<h3>' + esc(l.id) + '</h3><p class="note" style="margin:0">' + esc(status(l)[0]) + (l.daysLeft != null ? ' · baki ' + l.daysLeft + ' hari' : '') + '</p>' +
      '<label>Sekolah<input name="school" value="' + esc(l.school) + '"></label><label>Pelan' + planSel(l.plan) + '</label><label>Tarikh tamat<input name="expires" type="date" value="' + esc(l.expires) + '"></label>' +
      '<div class="row end"><button class="btn" data-close>Batal</button><button class="btn p" data-x="save">Simpan</button></div>' +
      '<label style="margin-top:18px">Tambah tempoh (disambung dari tarikh tamat jika masih aktif)</label><div class="row" style="margin-top:6px"><button class="btn" data-x="m1">+1 bulan</button><button class="btn" data-x="m3">+3 bulan</button><button class="btn" data-x="m12">+12 bulan</button></div>' +
      '<div class="row" style="margin-top:18px;border-top:1px solid var(--line);padding-top:14px"><button class="btn" data-x="move">Pindah ke e-mel lain</button><button class="btn d" data-x="del">Padam lesen</button></div>', function (o) {
      var v = function (n) { return o.querySelector('[name="' + n + '"]').value; };
      o.addEventListener('click', function (e) {
        var x = e.target.dataset.x; if (!x) return;
        if (x === 'save') { if (!v('expires')) return alert('Tarikh tamat diperlukan.'); o.remove(); run(api('/admin/licenses', { method: 'POST', body: Object.assign({ merge: true, school: v('school'), plan: v('plan'), expires: v('expires') }, who) }), 'Disimpan'); }
        else if (/^m\d+$/.test(x)) { o.remove(); run(api('/admin/licenses', { method: 'POST', body: Object.assign({ addMonths: +x.slice(1), school: v('school') }, who) }), 'Tempoh ditambah'); }
        else if (x === 'del') { if (confirm('Padam lesen ' + l.id + '? Pengguna kehilangan akses simpanan awan.')) { o.remove(); run(api('/admin/licenses?key=' + encodeURIComponent(l.key), { method: 'DELETE' }), 'Dipadam'); } }
        else if (x === 'move') {
          var to = (prompt('E-mel baharu untuk lesen ini:') || '').trim().toLowerCase(); if (!to) return;
          if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(to)) return alert('E-mel tidak sah.');
          if (S.data.licences.some(function (y) { return y.key === 'email:' + to; }) && !confirm(to + ' sudah ada lesen. Ganti?')) return;
          o.remove();
          run(api('/admin/licenses', { method: 'POST', body: { email: to, school: v('school'), plan: v('plan'), expires: v('expires') || l.expires } })
            .then(function () { return api('/admin/licenses?key=' + encodeURIComponent(l.key), { method: 'DELETE' }); }), 'Dipindah ke ' + to);
        }
      });
    });
  }
  function addDlg() {
    dialog('<h3>Tambah lesen</h3><label>E-mel Google (atau domain, contoh sekolah.edu.my)<input name="id" placeholder="cikgu@gmail.com"></label><label>Sekolah<input name="school"></label><label>Pelan' + planSel('bulanan') + '</label>' +
      '<label>Tarikh tamat<input name="expires" type="date"></label><label>atau tambah bulan dari hari ini<input name="months" type="number" min="1" max="120" placeholder="contoh 12"></label>' +
      '<div class="row end"><button class="btn" data-close>Batal</button><button class="btn p" data-x="ok">Tambah</button></div>', function (o) {
      o.querySelector('[data-x="ok"]').onclick = function () {
        var g = function (n) { return o.querySelector('[name="' + n + '"]').value.trim(); }, id = g('id').toLowerCase();
        if (!id) return alert('Isi e-mel atau domain.');
        var who = id.indexOf('@') >= 0 ? { email: id } : { domain: id };
        if (!g('expires') && !g('months')) return alert('Isi tarikh tamat atau bilangan bulan.');
        o.remove();
        run(api('/admin/licenses', { method: 'POST', body: Object.assign(g('months') ? { addMonths: +g('months'), school: g('school'), plan: g('plan') } : { school: g('school'), plan: g('plan'), expires: g('expires') }, who) }), 'Lesen ditambah');
      };
    });
  }
  function csv() {
    var rows = [['emel_atau_domain', 'jenis', 'sekolah', 'pelan', 'tamat', 'baki_hari', 'status', 'tidak_dikira']].concat(S.data.licences.map(function (l) { return [l.id, l.kind, l.school, l.plan, l.expires, l.daysLeft == null ? '' : l.daysLeft, status(l)[0], l.excluded ? 'ya' : '']; }));
    var text = rows.map(function (r) { return r.map(function (c) { return '"' + String(c).replace(/"/g, '""') + '"'; }).join(','); }).join('\n');
    var a = document.createElement('a'); a.href = URL.createObjectURL(new Blob(['﻿' + text], { type: 'text/csv' })); a.download = 'pelanggan-annur-' + S.data.today + '.csv'; a.click();
  }
  document.addEventListener('click', function (e) {
    var t = e.target.closest('[data-tab],[data-a]'); if (!t || !S.data) return; if (t.tagName === 'A' && t.dataset.tab) e.preventDefault();
    if (t.dataset.tab) { if (S.tab === 'artikel' && t.dataset.tab !== 'artikel' && window.ArtikelAdmin && ArtikelAdmin.dirty() && !confirm('Ada perubahan artikel belum disimpan. Tinggalkan juga?')) return; S.tab = t.dataset.tab; render(); return; }
    var a = t.dataset.a;
    if (a === 'edit') editDlg(t.dataset.k);
    else if (a === 'add') addDlg();
    else if (a === 'csv') csv();
    else if (a === 'reload') { if (S.tab === 'artikel' && window.ArtikelAdmin && ArtikelAdmin.dirty() && !confirm('Ada perubahan artikel belum disimpan. Muat semula juga?')) return; load(); }
    else if (a === 'logout') { S.token = ''; S.data = null; try { sessionStorage.removeItem('adm-tok'); } catch (x) { /* */ } loginView(); }
    else if (a === 'delslug' && confirm('Padam nama pautan /s/' + t.dataset.k + '? Pautan panjang guru masih berfungsi.')) {
      run(api('/admin/licenses?key=' + encodeURIComponent('slug:' + t.dataset.k), { method: 'DELETE' }).then(function () { return t.dataset.o ? api('/admin/licenses?key=' + encodeURIComponent('slugof:' + t.dataset.o), { method: 'DELETE' }) : null; }), 'Nama pautan dipadam');
    }
  });

  window.ADM = { api: api, esc: esc, toast: toast, dmy: dmy };
  if (!API) loginView('licenseUrl tiada dalam config.js.');
  else if (S.token) load(); else loginView();
})();
</script>
</body>
</html>
