<!doctype html>
<html lang="ms">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Dashboard Pemilik · Annur Time Table</title>
<style>
:root{--ink:#0f172a;--mut:#5b6b85;--line:#e3e8f2;--soft:#f5f7fb;--brand:#1d4ed8;--ok:#047857;--warn:#b45309;--bad:#b91c1c;--card:#fff}
*{box-sizing:border-box}
body{margin:0;background:var(--soft);color:var(--ink);font:15px/1.5 Inter,"Segoe UI",system-ui,Roboto,Arial,sans-serif}
a{color:var(--brand)}
button,input,select{font:inherit}
.top{background:#0b1b4d;color:#fff;padding:14px 22px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.top h1{font-size:18px;margin:0;font-weight:800}
.top .who{margin-left:auto;font-size:13px;opacity:.85}
.wrap{max-width:1280px;margin:0 auto;padding:20px}
.btn{border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:10px;padding:8px 14px;cursor:pointer;font-weight:600}
.btn:hover{border-color:#b9c4d8}
.btn.p{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.d{color:var(--bad)}
.btn.sm{padding:4px 10px;font-size:13px}
.btn:disabled{opacity:.5;cursor:default}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px;margin-bottom:18px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.kpi b{display:block;font-size:26px;font-weight:800;line-height:1.2}
.kpi span{font-size:13px;color:var(--mut)}
.kpi.ok b{color:var(--ok)}.kpi.warn b{color:var(--warn)}.kpi.bad b{color:var(--bad)}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.tabs button{border:0;background:transparent;padding:8px 14px;border-radius:999px;cursor:pointer;font-weight:600;color:var(--mut)}
.tabs button.on{background:var(--ink);color:#fff}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;overflow:hidden}
.bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.bar input,.bar select{border:1px solid var(--line);border-radius:10px;padding:8px 12px;background:#fff}
.bar input{min-width:220px;flex:1}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:middle;white-space:nowrap}
th{font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--mut);background:var(--soft);position:sticky;top:0}
td.w{white-space:normal;min-width:160px}
tr:hover td{background:#fafbff}
.pill{display:inline-block;border-radius:999px;padding:2px 10px;font-size:12px;font-weight:700}
.s-ok{background:#d1fae5;color:var(--ok)}.s-trial{background:#dbeafe;color:#1e40af}.s-grace{background:#fef3c7;color:var(--warn)}.s-bad{background:#fee2e2;color:var(--bad)}.s-mut{background:#eef1f5;color:var(--mut)}
.tag{font-size:11px;background:#eef1f5;color:var(--mut);border-radius:6px;padding:1px 6px;margin-left:6px}
.empty{color:var(--mut);padding:20px;text-align:center}
.login{max-width:440px;margin:60px auto;background:#fff;border:1px solid var(--line);border-radius:16px;padding:26px}
.login h2{margin:0 0 6px}
.login p{color:var(--mut);margin:6px 0 16px}
.login input{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:8px 0}
.err{color:var(--bad);font-weight:600;margin-top:10px}
.note{font-size:13px;color:var(--mut);margin-top:12px}
.ov{position:fixed;inset:0;background:rgba(15,23,42,.45);display:flex;align-items:center;justify-content:center;padding:16px;z-index:10}
.dlg{background:#fff;border-radius:16px;max-width:520px;width:100%;padding:20px;max-height:92vh;overflow:auto}
.dlg h3{margin:0 0 4px}
.dlg label{display:block;font-size:13px;color:var(--mut);margin-top:12px}
.dlg input,.dlg select{width:100%;border:1px solid var(--line);border-radius:10px;padding:9px 12px;margin-top:4px;color:var(--ink)}
.dlg .row{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.dlg .row.end{justify-content:flex-end}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:999px;font-weight:600;z-index:20}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:820px){.grid2{grid-template-columns:1fr}}
h4{margin:0 0 10px}
</style>
</head>
<body>
<div class="top"><h1>Annur Time Table · Dashboard Pemilik</h1><span class="who" id="who"></span></div>
<div class="wrap" id="app"><p class="empty">Memuatkan…</p></div>
<script src="/config.js"></script>
<script>
(function () {
  'use strict';
  var CFG = window.APP_CONFIG || {}, API = String(CFG.licenseUrl || '').replace(/\/$/, '');
  var S = { token: '', data: null, tab: 'pelanggan', q: '', f: 'semua', busy: false };
  var $ = function (id) { return document.getElementById(id); };
  var esc = function (s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); };
  var rm = function (n) { return 'RM' + (Number(n) || 0).toLocaleString('ms-MY', { minimumFractionDigits: 0, maximumFractionDigits: 2 }); };
  var dmy = function (iso) { return iso ? iso.slice(8, 10) + '/' + iso.slice(5, 7) + '/' + iso.slice(0, 4) : '-'; };
  var PLAN = { percubaan: 'Percubaan', bulanan: 'Bulanan', tahunan: 'Tahunan', pilot: 'Perintis' };
  function toast(t) { var d = document.createElement('div'); d.className = 'toast'; d.textContent = t; document.body.appendChild(d); setTimeout(function () { d.remove(); }, 2600); }
  try { S.token = sessionStorage.getItem('adm-tok') || ''; } catch (e) { /* tiada storan */ }

  function api(path, opt) {
    opt = opt || {};
    return fetch(API + path, { method: opt.method || 'GET', headers: Object.assign({ authorization: 'Bearer ' + S.token }, opt.body ? { 'content-type': 'application/json' } : {}), body: opt.body ? JSON.stringify(opt.body) : undefined })
      .then(function (r) { return r.json().catch(function () { return {}; }).then(function (j) { if (!r.ok) { var e = new Error(j.error || ('HTTP ' + r.status)); e.status = r.status; throw e; } return j; }); });
  }
  function load() {
    $('app').innerHTML = '<p class="empty">Memuatkan data…</p>';
    return api('/admin/overview').then(function (d) { S.data = d; $('who').textContent = d.by === 'token' ? 'Masuk dengan token admin' : 'Masuk sebagai ' + d.by; render(); })
      .catch(function (e) { if (e.status === 401) { S.token = ''; try { sessionStorage.removeItem('adm-tok'); } catch (x) { /* */ } loginView(e.message === 'tidak dibenarkan' ? 'Akaun ini tidak dibenarkan, atau sesi sudah tamat. Log masuk semula.' : e.message); } else $('app').innerHTML = '<div class="login"><p class="err">Tidak dapat memuatkan data: ' + esc(e.message) + '</p><button class="btn" onclick="location.reload()">Cuba lagi</button></div>'; });
  }
  function setToken(t) { S.token = t; try { sessionStorage.setItem('adm-tok', t); } catch (e) { /* */ } load(); }

  // ---------- log masuk ----------
  function loginView(err) {
    $('who').textContent = '';
    $('app').innerHTML = '<div class="login"><h2>Log masuk pemilik</h2><p>Hanya e-mel dalam OWNER_EMAILS (tetapan Worker lesen) dibenarkan.</p>' +
      '<button class="btn p" id="gIn" style="width:100%">Log masuk dengan Google</button>' +
      '<details style="margin-top:16px"><summary style="cursor:pointer;color:var(--mut)">Guna ADMIN_TOKEN</summary><input id="tokIn" type="password" placeholder="Tampal ADMIN_TOKEN" autocomplete="off"><button class="btn" id="tokGo">Masuk</button>' +
      '<p class="note">Token disimpan dalam tab ini sahaja dan hilang bila tab ditutup.</p></details>' + (err ? '<p class="err">' + esc(err) + '</p>' : '') + '</div>';
    $('gIn').onclick = googleLogin;
    $('tokGo').onclick = function () { var v = $('tokIn').value.trim(); if (v) setToken(v); };
  }
  function googleLogin() {
    var go = function () {
      if (!window.google || !google.accounts || !google.accounts.oauth2) return loginView('Skrip log masuk Google gagal dimuatkan. Semak sambungan internet atau penyekat iklan.');
      google.accounts.oauth2.initTokenClient({ client_id: CFG.googleClientId, scope: 'openid https://www.googleapis.com/auth/userinfo.email', callback: function (r) { if (r && r.access_token) setToken(r.access_token); else loginView('Log masuk dibatalkan.'); } }).requestAccessToken();
    };
    if (window.google && google.accounts) return go();
    var s = document.createElement('script'); s.src = 'https://accounts.google.com/gsi/client'; s.onload = go; s.onerror = go; document.head.appendChild(s);
  }

  // ---------- paparan ----------
  function status(l) {
    if (l.status === 'ok') return l.plan === 'percubaan' ? ['Percubaan', 's-trial'] : ['Aktif', 's-ok'];
    if (l.status === 'tamat-tempoh-ihsan') return ['Tempoh ihsan', 's-grace'];
    if (l.status === 'percubaan-tamat') return ['Percubaan tamat', 's-mut'];
    return ['Tamat', 's-bad'];
  }
  function kpis(st) {
    var conv = st.trialsTotal ? Math.round(st.converted / st.trialsTotal * 100) : 0;
    var k = [['ok', st.paidActive, 'Langganan berbayar aktif'], ['', st.trialActive, 'Percubaan aktif'], ['ok', rm(st.mrr), 'Anggaran hasil sebulan (MRR)'],
      ['', rm(st.revenue30), 'Bayaran 30 hari (' + st.payments30 + ' transaksi)'], ['', st.trials7 + ' / ' + st.trials30, 'Percubaan baharu 7 / 30 hari'],
      ['', conv + '%', 'Kadar tukar percubaan ke berbayar (' + st.converted + '/' + st.trialsTotal + ')'], [st.grace ? 'warn' : '', st.grace, 'Dalam tempoh ihsan'],
      [st.webhookFailed30 ? 'bad' : '', st.webhookFailed30, 'Webhook gagal 30 hari'], ['', rm(st.revenueAll), 'Jumlah bayaran direkod']];
    return '<div class="kpis">' + k.map(function (x) { return '<div class="kpi ' + x[0] + '"><b>' + esc(x[1]) + '</b><span>' + esc(x[2]) + '</span></div>'; }).join('') + '</div>';
  }
  function custTable(d) {
    var q = S.q.toLowerCase();
    var rows = d.licences.filter(function (l) {
      if (q && (l.id + ' ' + l.school).toLowerCase().indexOf(q) < 0) return false;
      var s = status(l)[0];
      return S.f === 'semua' || (S.f === 'aktif' && s === 'Aktif') || (S.f === 'percubaan' && s === 'Percubaan') || (S.f === 'ihsan' && s === 'Tempoh ihsan') || (S.f === 'tamat' && (s === 'Tamat' || s === 'Percubaan tamat'));
    });
    return '<div class="bar"><input id="q" placeholder="Cari e-mel atau sekolah" value="' + esc(S.q) + '"><select id="f">' +
      [['semua', 'Semua'], ['aktif', 'Aktif berbayar'], ['percubaan', 'Percubaan'], ['ihsan', 'Tempoh ihsan'], ['tamat', 'Tamat']].map(function (o) { return '<option value="' + o[0] + '"' + (S.f === o[0] ? ' selected' : '') + '>' + o[1] + '</option>'; }).join('') +
      '</select><button class="btn p" data-a="add">+ Tambah lesen</button><button class="btn" data-a="csv">Export CSV</button><button class="btn" data-a="reload">Muat semula</button></div>' +
      '<div class="tw"><table><thead><tr><th>E-mel / domain</th><th>Sekolah</th><th>Pelan</th><th>Tamat</th><th>Baki</th><th>Status</th><th></th></tr></thead><tbody>' +
      (rows.map(function (l) {
        var s = status(l);
        return '<tr><td>' + esc(l.id) + (l.kind === 'domain' ? '<span class="tag">domain</span>' : '') + (l.excluded ? '<span class="tag">tidak dikira</span>' : '') + '</td><td class="w">' + esc(l.school || '-') + '</td><td>' + esc(PLAN[l.plan] || l.plan || '-') + '</td><td>' + dmy(l.expires) + '</td><td>' + (l.daysLeft == null ? '-' : l.daysLeft + ' hari') + '</td><td><span class="pill ' + s[1] + '">' + s[0] + '</span></td><td><button class="btn sm" data-a="edit" data-k="' + esc(l.key) + '">Edit</button></td></tr>';
      }).join('') || '<tr><td colspan="7" class="empty">Tiada rekod.</td></tr>') + '</tbody></table></div><p class="note">' + rows.length + ' daripada ' + d.licences.length + ' lesen.</p>';
  }
  function todo(d) {
    var t = d.licences.filter(function (l) { return !l.excluded; });
    var trialEnd = t.filter(function (l) { return l.plan === 'percubaan' && l.ok && l.daysLeft <= 3; });
    var trialGone = t.filter(function (l) { return l.status === 'percubaan-tamat' && l.daysLeft >= -14; });
    var renew = t.filter(function (l) { return l.plan !== 'percubaan' && l.ok && l.daysLeft != null && l.daysLeft <= 14; });
    var fail = d.logs.filter(function (x) { return x.result && x.result.ok === false; }).slice(0, 20);
    var list = function (title, arr, fn) { return '<div class="card"><h4>' + title + ' (' + arr.length + ')</h4>' + (arr.length ? '<div class="tw"><table><tbody>' + arr.map(fn).join('') + '</tbody></table></div>' : '<p class="empty">Tiada.</p>') + '</div>'; };
    var mail = function (l, sub) { return '<a href="mailto:' + esc(l.id) + '?subject=' + encodeURIComponent(sub) + '">' + esc(l.id) + '</a>'; };
    return '<div class="grid2">' +
      list('Percubaan tamat dalam 3 hari', trialEnd, function (l) { return '<tr><td>' + mail(l, 'Percubaan Annur Time Table') + '</td><td>' + esc(l.school) + '</td><td>' + dmy(l.expires) + '</td></tr>'; }) +
      list('Percubaan tamat 14 hari lepas, belum langgan', trialGone, function (l) { return '<tr><td>' + mail(l, 'Annur Time Table') + '</td><td>' + esc(l.school) + '</td><td>tamat ' + dmy(l.expires) + '</td></tr>'; }) +
      list('Langganan perlu diperbaharui (14 hari)', renew, function (l) { return '<tr><td>' + mail(l, 'Pembaharuan Annur Time Table') + '</td><td>' + esc(PLAN[l.plan] || l.plan) + '</td><td>' + dmy(l.expires) + ' (' + l.daysLeft + ' hari)</td></tr>'; }) +
      list('Webhook BCL gagal', fail, function (x) { return '<tr><td>' + esc(x.at.slice(0, 16).replace('T', ' ')) + '</td><td>' + esc(x.event || '') + '</td><td>' + esc(x.result.reason || '') + '</td></tr>'; }) + '</div>' +
      '<p class="note">Webhook gagal: semak BCL, Tools, Webhook Logs dan tekan Resend. Jika e-mel dalam borang salah, Edit lesen e-mel yang betul.</p>';
  }
  function pays(d) {
    var all = d.payments.map(function (p) { return Object.assign({ jenis: 'Bayaran', id: p.order }, p); }).concat(d.debits.map(function (p) { return Object.assign({ jenis: 'Auto-debit', id: p.ref }, p); }))
      .sort(function (a, b) { return String(b.at).localeCompare(String(a.at)); });
    return '<div class="tw"><table><thead><tr><th>Tarikh</th><th>Jenis</th><th>E-mel</th><th>Bulan</th><th>Jumlah</th><th>Lesen hingga</th><th>Rujukan</th></tr></thead><tbody>' +
      (all.map(function (p) { return '<tr><td>' + dmy(p.at) + '</td><td>' + p.jenis + '</td><td>' + esc(p.email) + '</td><td>' + esc(p.months || '-') + '</td><td>' + (p.amount != null ? rm(p.amount) : '-') + '</td><td>' + dmy(p.expires) + '</td><td>' + esc(p.id) + '</td></tr>'; }).join('') || '<tr><td colspan="7" class="empty">Belum ada bayaran.</td></tr>') +
      '</tbody></table></div><p class="note">Jumlah hanya untuk bayaran yang direkod selepas kemas kini Worker ini; bayaran lebih awal ditunjuk "-". Mandat auto-debit: ' + d.mandates.length + '.</p>';
  }
  function logs(d) {
    return '<div class="tw"><table><thead><tr><th>Masa (UTC)</th><th>Peristiwa</th><th>Keputusan</th></tr></thead><tbody>' +
      (d.logs.map(function (x) { var r = x.result || {}, s = r.ok === false ? '<span class="pill s-bad">gagal</span> ' + esc(r.reason || '') : r.ignored ? '<span class="pill s-mut">diabaikan</span> ' + esc(r.ignored) : r.duplicate ? '<span class="pill s-mut">berulang</span>' : '<span class="pill s-ok">ok</span> ' + esc(r.email || ''); return '<tr><td>' + esc(x.at.slice(0, 19).replace('T', ' ')) + '</td><td>' + esc(x.event || '') + '</td><td class="w">' + s + '</td></tr>'; }).join('') || '<tr><td colspan="3" class="empty">Tiada log (disimpan 90 hari).</td></tr>') + '</tbody></table></div>';
  }
  function slugs(d) {
    return '<div class="tw"><table><thead><tr><th>Nama pautan</th><th>Pemilik</th><th>Sekolah</th><th></th></tr></thead><tbody>' +
      (d.slugs.map(function (x) { return '<tr><td><a href="https://annurtimetable.com/s/' + esc(x.slug) + '" target="_blank" rel="noopener">/s/' + esc(x.slug) + '</a></td><td>' + esc(x.owner || '') + '</td><td>' + esc(x.school || '') + '</td><td><button class="btn sm d" data-a="delslug" data-k="' + esc(x.slug) + '" data-o="' + esc(x.owner || '') + '">Padam</button></td></tr>'; }).join('') || '<tr><td colspan="4" class="empty">Tiada nama pautan.</td></tr>') + '</tbody></table></div>';
  }
  function perf() {
    return '<div class="card"><h4>Prestasi teknikal</h4><p>Kadar ralat, bilangan permintaan dan masa tindak balas Worker dipapar oleh Cloudflare: dashboard Cloudflare, Workers &amp; Pages, pilih <b>annurtimetable</b> (app) atau <b>jadual-sekolah-lesen</b> (lesen), tab Metrics.</p>' +
      '<p class="note">App tidak menghantar data penggunaan sekolah kepada kita (data kekal dalam Google Drive sekolah), jadi statistik seperti bilangan jadual dijana tidak tersedia.</p>' +
      '<p><a class="btn" href="https://dash.cloudflare.com/?to=/:account/workers-and-pages" target="_blank" rel="noopener">Buka Cloudflare Workers</a></p></div>';
  }
  function render() {
    var d = S.data, tabs = [['pelanggan', 'Pelanggan'], ['tindakan', 'Perlu tindakan'], ['bayaran', 'Bayaran'], ['log', 'Log webhook'], ['pautan', 'Nama pautan'], ['prestasi', 'Prestasi']];
    var body = { pelanggan: custTable, tindakan: todo, bayaran: pays, log: logs, pautan: slugs, prestasi: perf }[S.tab](d);
    $('app').innerHTML = kpis(d.stats) + '<div class="tabs">' + tabs.map(function (t) { return '<button data-tab="' + t[0] + '" class="' + (S.tab === t[0] ? 'on' : '') + '">' + t[1] + '</button>'; }).join('') +
      '<button data-a="logout" style="margin-left:auto">Log keluar</button></div>' + (S.tab === 'tindakan' || S.tab === 'prestasi' ? body : '<div class="card">' + body + '</div>') +
      '<p class="note">Data setakat ' + dmy(d.today) + '. Lesen dalam STATS_EXCLUDE ditanda "tidak dikira" dan tidak masuk statistik.</p>';
    var q = $('q'); if (q) { q.oninput = function () { S.q = q.value; var p = q.selectionStart; render(); var n = $('q'); n.focus(); n.setSelectionRange(p, p); }; }
    var f = $('f'); if (f) f.onchange = function () { S.f = f.value; render(); };
  }

  // ---------- borang ----------
  function dialog(html, onReady) { var o = document.createElement('div'); o.className = 'ov'; o.innerHTML = '<div class="dlg">' + html + '</div>'; o.addEventListener('click', function (e) { if (e.target === o || e.target.dataset.close != null) o.remove(); }); document.body.appendChild(o); if (onReady) onReady(o); return o; }
  function planSel(v) { return '<select name="plan">' + Object.keys(PLAN).map(function (k) { return '<option value="' + k + '"' + (v === k ? ' selected' : '') + '>' + PLAN[k] + '</option>'; }).join('') + '</select>'; }
  function run(p, ok) { return p.then(function () { toast(ok); return load(); }).catch(function (e) { alert('Gagal: ' + e.message); }); }
  function editDlg(key) {
    var l = S.data.licences.find(function (x) { return x.key === key; }); if (!l) return;
    var who = l.kind === 'domain' ? { domain: l.id } : { email: l.id };
    dialog('<h3>' + esc(l.id) + '</h3><p class="note" style="margin:0">' + esc(status(l)[0]) + (l.daysLeft != null ? ' · baki ' + l.daysLeft + ' hari' : '') + '</p>' +
      '<label>Sekolah<input name="school" value="' + esc(l.school) + '"></label><label>Pelan' + planSel(l.plan) + '</label><label>Tarikh tamat<input name="expires" type="date" value="' + esc(l.expires) + '"></label>' +
      '<div class="row end"><button class="btn" data-close>Batal</button><button class="btn p" data-x="save">Simpan</button></div>' +
      '<label style="margin-top:18px">Tambah tempoh (disambung dari tarikh tamat jika masih aktif)</label><div class="row" style="margin-top:6px"><button class="btn" data-x="m1">+1 bulan</button><button class="btn" data-x="m3">+3 bulan</button><button class="btn" data-x="m12">+12 bulan</button></div>' +
      '<div class="row" style="margin-top:18px;border-top:1px solid var(--line);padding-top:14px"><button class="btn" data-x="move">Pindah ke e-mel lain</button><button class="btn d" data-x="del">Padam lesen</button></div>', function (o) {
      var v = function (n) { return o.querySelector('[name="' + n + '"]').value; };
      o.addEventListener('click', function (e) {
        var x = e.target.dataset.x; if (!x) return;
        if (x === 'save') { if (!v('expires')) return alert('Tarikh tamat diperlukan.'); o.remove(); run(api('/admin/licenses', { method: 'POST', body: Object.assign({ merge: true, school: v('school'), plan: v('plan'), expires: v('expires') }, who) }), 'Disimpan'); }
        else if (/^m\d+$/.test(x)) { o.remove(); run(api('/admin/licenses', { method: 'POST', body: Object.assign({ addMonths: +x.slice(1), school: v('school') }, who) }), 'Tempoh ditambah'); }
        else if (x === 'del') { if (confirm('Padam lesen ' + l.id + '? Pengguna kehilangan akses simpanan awan.')) { o.remove(); run(api('/admin/licenses?key=' + encodeURIComponent(l.key), { method: 'DELETE' }), 'Dipadam'); } }
        else if (x === 'move') {
          var to = (prompt('E-mel baharu untuk lesen ini:') || '').trim().toLowerCase(); if (!to) return;
          if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(to)) return alert('E-mel tidak sah.');
          if (S.data.licences.some(function (y) { return y.key === 'email:' + to; }) && !confirm(to + ' sudah ada lesen. Ganti?')) return;
          o.remove();
          run(api('/admin/licenses', { method: 'POST', body: { email: to, school: v('school'), plan: v('plan'), expires: v('expires') || l.expires } })
            .then(function () { return api('/admin/licenses?key=' + encodeURIComponent(l.key), { method: 'DELETE' }); }), 'Dipindah ke ' + to);
        }
      });
    });
  }
  function addDlg() {
    dialog('<h3>Tambah lesen</h3><label>E-mel Google (atau domain, contoh sekolah.edu.my)<input name="id" placeholder="cikgu@gmail.com"></label><label>Sekolah<input name="school"></label><label>Pelan' + planSel('bulanan') + '</label>' +
      '<label>Tarikh tamat<input name="expires" type="date"></label><label>atau tambah bulan dari hari ini<input name="months" type="number" min="1" max="120" placeholder="contoh 12"></label>' +
      '<div class="row end"><button class="btn" data-close>Batal</button><button class="btn p" data-x="ok">Tambah</button></div>', function (o) {
      o.querySelector('[data-x="ok"]').onclick = function () {
        var g = function (n) { return o.querySelector('[name="' + n + '"]').value.trim(); }, id = g('id').toLowerCase();
        if (!id) return alert('Isi e-mel atau domain.');
        var who = id.indexOf('@') >= 0 ? { email: id } : { domain: id };
        if (!g('expires') && !g('months')) return alert('Isi tarikh tamat atau bilangan bulan.');
        o.remove();
        run(api('/admin/licenses', { method: 'POST', body: Object.assign(g('months') ? { addMonths: +g('months'), school: g('school'), plan: g('plan') } : { school: g('school'), plan: g('plan'), expires: g('expires') }, who) }), 'Lesen ditambah');
      };
    });
  }
  function csv() {
    var rows = [['emel_atau_domain', 'jenis', 'sekolah', 'pelan', 'tamat', 'baki_hari', 'status', 'tidak_dikira']].concat(S.data.licences.map(function (l) { return [l.id, l.kind, l.school, l.plan, l.expires, l.daysLeft == null ? '' : l.daysLeft, status(l)[0], l.excluded ? 'ya' : '']; }));
    var text = rows.map(function (r) { return r.map(function (c) { return '"' + String(c).replace(/"/g, '""') + '"'; }).join(','); }).join('\n');
    var a = document.createElement('a'); a.href = URL.createObjectURL(new Blob(['﻿' + text], { type: 'text/csv' })); a.download = 'pelanggan-annur-' + S.data.today + '.csv'; a.click();
  }
  document.addEventListener('click', function (e) {
    var t = e.target.closest('[data-tab],[data-a]'); if (!t || !S.data) return;
    if (t.dataset.tab) { S.tab = t.dataset.tab; render(); return; }
    var a = t.dataset.a;
    if (a === 'edit') editDlg(t.dataset.k);
    else if (a === 'add') addDlg();
    else if (a === 'csv') csv();
    else if (a === 'reload') load();
    else if (a === 'logout') { S.token = ''; S.data = null; try { sessionStorage.removeItem('adm-tok'); } catch (x) { /* */ } loginView(); }
    else if (a === 'delslug' && confirm('Padam nama pautan /s/' + t.dataset.k + '? Pautan panjang guru masih berfungsi.')) {
      run(api('/admin/licenses?key=' + encodeURIComponent('slug:' + t.dataset.k), { method: 'DELETE' }).then(function () { return t.dataset.o ? api('/admin/licenses?key=' + encodeURIComponent('slugof:' + t.dataset.o), { method: 'DELETE' }) : null; }), 'Nama pautan dipadam');
    }
  });

  if (!API) $('app').innerHTML = '<div class="login"><p class="err">licenseUrl tiada dalam config.js.</p></div>';
  else if (S.token) load(); else loginView();
})();
</script>
</body>
</html>
